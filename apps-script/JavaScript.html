<script>
// FridgeIQ — client logic. Calls the Apps Script server (Code.gs) via
// google.script.run, which in turn calls the Gemini API with the key
// stored server-side in Script Properties.

const HISTORY_KEY = 'fridgeiq_history';
const MAX_HISTORY = 8;
const MAX_IMAGE_DIMENSION = 1024; // keep uploads small & fast for Gemini

const state = {
  step: 1,
  images: { fridge: null, pantry: null },
  missingItems: [],
};

// ---------- Navigation ----------

function goToStep(step) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById(`panel-${step}`).classList.add('active');
  state.step = step;

  document.querySelectorAll('.step-dot').forEach(dot => {
    const n = Number(dot.dataset.step);
    dot.classList.toggle('active', n === step);
    dot.classList.toggle('done', n < step);
  });
}

function goBack() {
  if (state.step > 1 && state.step <= 4) {
    goToStep(state.step - 1);
  } else {
    openExitModal();
  }
}

// ---------- Image upload (resized client-side before it ever leaves the browser) ----------

function handleImageUpload(event, kind) {
  const file = event.target.files[0];
  if (!file) return;

  resizeImageFile(file, MAX_IMAGE_DIMENSION).then(dataUrl => {
    state.images[kind] = dataUrl;

    const preview = document.getElementById(`${kind}Preview`);
    const label = document.getElementById(`${kind}UploadText`);
    preview.src = dataUrl;
    preview.classList.remove('hidden');
    label.classList.add('hidden');

    if (kind === 'fridge') document.getElementById('toStep2').disabled = false;
    if (kind === 'pantry') document.getElementById('toStep3').disabled = false;
  });
}

function resizeImageFile(file, maxDimension) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();

    reader.onload = () => { img.src = reader.result; };
    reader.onerror = reject;

    img.onload = () => {
      const scale = Math.min(1, maxDimension / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);

      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = reject;

    reader.readAsDataURL(file);
  });
}

// ---------- Analysis (Gemini, via the Apps Script server) ----------

function runAnalysis() {
  state.missingItems = document.getElementById('missingItemsInput').value;

  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-loading').classList.add('active');

  google.script.run
    .withSuccessHandler(result => {
      renderResults(result);
      saveToHistory(result);
      goToStep(4);
    })
    .withFailureHandler(showAnalysisError)
    .analyzeImages(state.images.fridge, state.images.pantry, state.missingItems);
}

function showAnalysisError(error) {
  const message = (error && error.message) || String(error);
  const errorBox = document.getElementById('errorText');

  if (message.indexOf('MISSING_API_KEY') !== -1) {
    errorBox.textContent = 'מפתח ה-Gemini API עדיין לא מוגדר. פתחי את עורך ה-Apps Script → Project Settings → Script Properties, והוסיפי מפתח בשם GEMINI_API_KEY (אפשר לקבל מפתח ב-aistudio.google.com/apikey).';
  } else if (message.indexOf('GEMINI_ERROR') !== -1) {
    errorBox.textContent = 'שגיאה מול Gemini: ' + message.replace('GEMINI_ERROR: ', '');
  } else {
    errorBox.textContent = 'שגיאה בניתוח התמונות: ' + message;
  }

  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-error').classList.add('active');
}

// ---------- Render results ----------

function renderResults(result) {
  document.getElementById('savingsBox').textContent =
    `💰 חסכתם עד כה כ-₪${result.estimatedSavings} בזכות ניצול נכון של המקרר`;

  const wasteContainer = document.getElementById('wasteAlerts');
  const expiring = result.detectedItems.filter(i => i.expiringSoon);
  wasteContainer.innerHTML = expiring.length
    ? `<div class="waste-alert">⏰ ${expiring.map(i => i.name).join(', ')} מתקרבים לתאריך התפוגה — המתכונים למטה מנצלים אותם קודם</div>`
    : '';

  const chips = document.getElementById('detectedItems');
  chips.innerHTML = result.detectedItems
    .map(i => `<span class="chip ${i.expiringSoon ? 'expiring' : ''}">${escapeHtml(i.name)}</span>`)
    .join('');

  const grid = document.getElementById('recipeGrid');
  grid.innerHTML = result.recipes
    .map(r => `
      <div class="recipe-card">
        <h4>${escapeHtml(r.title)}</h4>
        <p>${escapeHtml(r.description)}</p>
        <div class="recipe-tags">${r.tags.map(t => `<span>${escapeHtml(t)}</span>`).join('')}</div>
      </div>`)
    .join('');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

// ---------- Scan history (stored in the browser only — never sent to the server) ----------

function saveToHistory(result) {
  const history = getHistory();
  history.unshift({
    date: new Date().toISOString(),
    thumbnail: state.images.fridge || state.images.pantry,
    itemCount: result.detectedItems.length,
    savings: result.estimatedSavings,
  });
  try {
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(0, MAX_HISTORY)));
  } catch (e) {
    console.warn('Could not save scan history locally:', e);
  }
  renderHistory();
}

function getHistory() {
  try {
    return JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
  } catch {
    return [];
  }
}

function renderHistory() {
  const row = document.getElementById('historyRow');
  const history = getHistory();

  if (!history.length) {
    row.innerHTML = '<span class="history-empty">עדיין אין סריקות שמורות</span>';
    return;
  }

  row.innerHTML = history
    .map(h => {
      const d = new Date(h.date);
      const label = d.toLocaleDateString('he-IL', { day: '2-digit', month: '2-digit' });
      return `
        <div class="history-item">
          <img src="${h.thumbnail}" alt="סריקה מ-${label}">
          ${label} · ${h.itemCount} פריטים
        </div>`;
    })
    .join('');
}

function clearHistory() {
  localStorage.removeItem(HISTORY_KEY);
  renderHistory();
}

// ---------- Exit modal ----------

function openExitModal() {
  document.getElementById('exitModal').classList.add('open');
}

function closeExitModal() {
  document.getElementById('exitModal').classList.remove('open');
}

function confirmExit() {
  closeExitModal();
}

// ---------- Init ----------

document.addEventListener('DOMContentLoaded', () => {
  renderHistory();
});
</script>
